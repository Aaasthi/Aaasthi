name: aaasthi
x-app: &app
  build:
    context: .
    target: runner
  environment: &app-env
    DATABASE_URL: postgresql://aaasthi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aaasthi
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: aaasthi
      POSTGRES_DB: aaasthi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaasthi -d aaasthi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  postgres_data:
